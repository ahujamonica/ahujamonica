name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_STATS_TOKEN }}
        run: |
          python scripts/github_stats.py
          python scripts/github_stats_svg.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.json

          git diff --cached --quiet || git commit -m "chore: update github stats"
          git push
