    <rect x="70" y="145" width="86" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="113" y="164" text-anchor="middle" fill="#39d353" font-family="monospace" font-size="12">REST APIs</text>
  </g>

  <g class="float4">
