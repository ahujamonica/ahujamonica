<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <title>Monica Ahuja's technology stack</title>
  <desc>Floating technology logos including Java, C++, Python, JavaScript, TypeScript, Spring Boot, React, Node.js, HTML, CSS, Tailwind CSS, MySQL, MongoDB, AWS, Docker, Git, GitHub, Postman, VS Code, IntelliJ IDEA, REST APIs, JWT and MediaPipe.</desc>

  <style>
    .float1 { animation: float1 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float2 { animation: float2 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float3 { animation: float3 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float4 { animation: float4 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes float1 {
      0%,100% { transform: translate(0,0) rotate(-1deg); }
      50% { transform: translate(0,-9px) rotate(1deg); }
    }
    @keyframes float2 {
      0%,100% { transform: translate(0,2px) rotate(1deg); }
      50% { transform: translate(5px,-7px) rotate(-1deg); }
    }
    @keyframes float3 {
      0%,100% { transform: translate(0,0) rotate(1deg); }
      50% { transform: translate(-4px,-10px) rotate(-1deg); }
    }
    @keyframes float4 {
      0%,100% { transform: translate(0,1px) rotate(-1deg); }
      50% { transform: translate(4px,-6px) rotate(1deg); }
    }

    .icon {
      cursor: help;
      transition: transform .2s ease, opacity .2s ease;
    }
    .icon:hover {
      transform: scale(1.12);
      opacity: .9;
    }
  </style>

  <!-- subtle terminal-style background -->
  <rect x="1" y="1" width="898" height="428" rx="18" fill="#0d1117" stroke="#30363d"/>

  <g opacity=".28" fill="#39d353">
    <circle cx="32" cy="32" r="5"/>
    <circle cx="50" cy="32" r="5"/>
    <circle cx="68" cy="32" r="5"/>
  </g>
  <text x="95" y="38" fill="#8b949e" font-family="monospace" font-size="14">monica@github:~$ tech-stack</text>

  <!-- Java -->
  <g class="icon float1" transform="translate(105 100)">
    <title>Java</title>
    <image width="58" height="58" href="https://cdn.simpleicons.org/openjdk/ED8B00"/>
  </g>

  <!-- C++ -->
  <g class="icon float3" transform="translate(260 72)">
    <title>C++</title>
    <image width="58" height="58" href="https://cdn.simpleicons.org/cplusplus/00599C"/>
  </g>

  <!-- Python -->
  <g class="icon float2" transform="translate(420 115)">
    <title>Python</title>
    <image width="58" height="58" href="https://cdn.simpleicons.org/python/3776AB"/>
  </g>

  <!-- JavaScript -->
  <g class="icon float4" transform="translate(580 78)">
    <title>JavaScript</title>
    <image width="58" height="58" href="https://cdn.simpleicons.org/javascript/F7DF1E"/>
  </g>

  <!-- TypeScript -->
  <g class="icon float1" transform="translate(740 112)">
    <title>TypeScript</title>
