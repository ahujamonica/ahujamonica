    <title>GitHub</title>
    <image width="48" height="48" href="https://cdn.simpleicons.org/github/F0F6FC"/>
  </g>

  <!-- Docker -->
  <g class="icon float1" transform="translate(365 365)">
    <title>Docker</title>
    <image width="48" height="48" href="https://cdn.simpleicons.org/docker/2496ED"/>
  </g>

  <!-- Postman -->
  <g class="icon float3" transform="translate(485 372)">
    <title>Postman</title>
    <image width="48" height="48" href="https://cdn.simpleicons.org/postman/FF6C37"/>
  </g>

  <!-- VS Code -->
  <g class="icon float2" transform="translate(600 365)">
    <title>Visual Studio Code</title>
    <image width="48" height="48" href="https://cdn.simpleicons.org/visualstudiocode/007ACC"/>
